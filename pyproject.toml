[project]
name = "bridge"
version = "0.1.0"
description = "Instrument control and analysis suite for DC and MFLI lock-in measurements in a spintronics lab"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joacim Stenlund", email = "joacim.stenlund@physics.uu.se" }]
requires-python = ">=3.14"
dependencies = [
    "gpib-ctypes>=0.3.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pymeasure>=0.15.0",
    "pyside6>=6.10.2",
    "pyvisa-py>=0.8.1",
    "textual>=8.2.8",
    "zeroconf>=0.148.0",
    "zhinst-toolkit>=1.3.0",
    "zhinst-core>=26.7,<26.8",
    "scipy>=1.18.0",
    "nicegui[plotly]>=3.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dc*", "mfli*", "instruments*", "analysis*", "web*"]
